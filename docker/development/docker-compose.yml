version: "3.9"

services:

  postgres:

    image: postgres:16-alpine
    container_name: resume_postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - resume_network


  redis:

    image: redis:7-alpine
    container_name: resume_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume_network


  web:

    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    container_name: resume_web
    restart: unless-stopped
    env_file:
      - ../../.env
    command: >
      python manage.py runserver
      0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health/"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - resume_network


  celery:

    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    container_name: resume_celery
    restart: unless-stopped
    env_file:
      - ../../.env
    command: >
      celery -A config worker --loglevel=info
    volumes:
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "config",
          "inspect",
          "ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - resume_network


  celery-beat:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    container_name: resume_celery_beat
    restart: unless-stopped
    env_file:
      - ../../.env
    command: >
      celery -A config beat --loglevel=info
    volumes:
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume_network


  flower:

    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    container_name: resume_flower
    restart: unless-stopped
    env_file:
      - ../../.env
    command: >
      celery -A config flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - resume_network


  nginx:
    image: nginx:alpine
    container_name: resume_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    networks:
      - resume_network


networks:
  resume_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: