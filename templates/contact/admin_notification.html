<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

</head>

<body>

<h2>New Contact Message</h2>

<hr>

<p>

<strong>Reference:</strong>

{{ message.reference }}

</p>

<p>

<strong>Name:</strong>

{{ message.name }}

</p>

<p>

<strong>Email:</strong>

{{ message.email }}

</p>

<p>

<strong>Subject:</strong>

{{ message.subject }}

</p>

<p>

<strong>Message</strong>

</p>

<p>

{{ message.message|linebreaks }}

</p>

<hr>

<p>

IP:

{{ message.ip_address }}

</p>

<p>

User Agent:

{{ message.user_agent }}

</p>

</body>

</html>
